name: CI

on:
  push:
  pull_request:

jobs:
  lockfile-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify lockfile install
        run: sh scripts/verify_lockfile.sh

      - name: Ruff
        run: ruff check app tests scripts

      - name: Secret scan (tracked files)
        run: python scripts/secret_scan_repo.py

      - name: Pytest (unit)
        run: pytest -q

      - name: Audit remediation matrix
        run: python scripts/audit_remediation_status.py

      - name: Remediation verify (gates)
        run: ./scripts/remediation_verify.sh

      - name: Live signoff absent in CI (expected)
        run: |
          if python scripts/validate_live_signoff.py; then
            echo "live_kwork_signoff.json must not be committed to CI"
            exit 1
          fi

      - name: pip check
        run: pip check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot_ci
          POSTGRES_DB: jobpilot_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jobpilot:jobpilot_ci@localhost:5432/jobpilot_ai_test
      REDIS_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/2
      CELERY_RESULT_BACKEND: redis://localhost:6379/3
      QDRANT_URL: http://localhost:6333
      JOBPILOT_INTEGRATION_TESTS: "1"
      API_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: sh scripts/verify_lockfile.sh

      - name: Install PostgreSQL client (restore drill tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Integration pytest
        run: |
          pytest -q \
            tests/test_integration_db.py \
            tests/test_migration_preflight_integration.py \
            tests/test_c018_legacy_upgrade_acceptance.py \
            tests/test_c098_restore_drill_acceptance.py \
            tests/test_acceptance_dry_run.py \
            tests/test_acceptance_inbox_flow.py \
            tests/test_send_attempt_inbox_concurrency.py \
            tests/test_send_attempt_reconcile.py \
            tests/test_notification_outbox_delivery.py \
            tests/test_job_processing_integration.py

  browser-form-contract:
    runs-on: ubuntu-latest
    env:
      JOBPILOT_BROWSER_TESTS: "1"
      PLATFORM_DRY_RUN: "true"
      EMBEDDING_PROVIDER: "disabled"
      TELEGRAM_BOT_TOKEN: ""
      KWORK_EMAIL: ""
      KWORK_PASSWORD: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      CURSOR_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: sh scripts/verify_lockfile.sh

      - name: Install Chromium for offline form fixtures
        run: python -m playwright install --with-deps chromium

      - name: Browser form contract (synthetic offline HTML)
        run: python -m pytest -q tests/test_kwork_form_dom.py tests/test_frozen_submission.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t jobpilot-ai:ci .
