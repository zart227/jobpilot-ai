x-app-env: &app-env
    PYTHONPATH: /app
    DATABASE_URL: postgresql+asyncpg://jobpilot:${POSTGRES_PASSWORD:-jobpilot_secret}@postgres:5432/jobpilot_ai
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    QDRANT_URL: http://qdrant:6333
    JOBPILOT_IN_DOCKER: "1"

# Match host user so bind-mounted ./data is not created as root (default: arthur 1000:1000).
x-app-user: &app-user
    user: "${JOBPILOT_DOCKER_UID:-1000}:${JOBPILOT_DOCKER_GID:-1000}"

x-docker-logging: &docker-logging
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

services:
    postgres:
        image: postgres:16-alpine
        container_name: jobpilot-postgres
        environment:
            POSTGRES_USER: jobpilot
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_secret}
            POSTGRES_DB: jobpilot_ai
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5434:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot_ai"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: jobpilot-redis
        ports:
            - "127.0.0.1:6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    qdrant:
        image: qdrant/qdrant:v1.13.6
        container_name: jobpilot-qdrant
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        ports:
            - "127.0.0.1:6333:6333"
            - "127.0.0.1:6334:6334"
        volumes:
            - qdrant_data:/qdrant/storage
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    api:
        build: .
        container_name: jobpilot-api
        <<: [*app-user, *docker-logging]
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        env_file: .env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            <<: *app-env
            API_HOST: 0.0.0.0
            API_PORT: 8000
            JOBPILOT_SKIP_DB_MIGRATE: "0"
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        volumes:
            - ./app:/app/app
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic:ro
            - ./scripts:/app/scripts
            - /home/arthur/vfs-visa-bot/output/proxy-lists:/app/proxy-lists:ro
            - ./data:/app/data

    celery-worker:
        build: .
        container_name: jobpilot-celery-worker
        <<: [*app-user, *docker-logging]
        command: celery -A app.celery_app worker --loglevel=info --concurrency=2
        env_file: .env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            <<: *app-env
            JOBPILOT_SKIP_DB_MIGRATE: "1"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        volumes:
            - ./app:/app/app
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic:ro
            - ./scripts:/app/scripts:ro
            - /home/arthur/vfs-visa-bot/output/proxy-lists:/app/proxy-lists:ro
            - ./data:/app/data

    celery-beat:
        build: .
        container_name: jobpilot-celery-beat
        <<: [*app-user, *docker-logging]
        command: celery -A app.celery_app beat --loglevel=info
        env_file: .env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            <<: *app-env
            JOBPILOT_SKIP_DB_MIGRATE: "1"
        depends_on:
            redis:
                condition: service_healthy
            api:
                condition: service_started
        volumes:
            - ./app:/app/app
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic:ro
            - /home/arthur/vfs-visa-bot/output/proxy-lists:/app/proxy-lists:ro
            - ./data:/app/data

    telegram-bot:
        build: .
        container_name: jobpilot-telegram
        <<: [*app-user, *docker-logging]
        command: python -m app.telegram.bot
        env_file:
            - .env
            - path: data/cursor_bridge.env
              required: false
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            <<: *app-env
            API_HOST: api
            API_PORT: 8000
            JOBPILOT_SKIP_DB_MIGRATE: "1"
            CURSOR_WORKSPACE_HOST: ${JOBPILOT_HOST_WORKSPACE:-/home/arthur/jobpilot-ai}
            CURSOR_BRIDGE_BASE_URL: ${CURSOR_BRIDGE_BASE_URL:-http://host.docker.internal:9247}
            TELEGRAM_DEV_AGENT_ENABLED: ${TELEGRAM_DEV_AGENT_ENABLED:-true}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            api:
                condition: service_started
            cursor-bridge-proxy:
                condition: service_started
        volumes:
            - ./app:/app/app
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic:ro
            - ./scripts:/app/scripts
            - ./data:/app/data
            - /home/arthur/vfs-visa-bot/output/proxy-lists:/app/proxy-lists:ro

    # Forwards host bridge (127.0.0.1:19247) to 0.0.0.0:9247 for containers on Linux
    cursor-bridge-proxy:
        image: alpine/socat:1.0.5
        container_name: jobpilot-cursor-proxy
        network_mode: host
        command: TCP-LISTEN:9247,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:19247
        restart: unless-stopped

volumes:
    postgres_data:
    qdrant_data:
